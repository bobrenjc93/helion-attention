[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helion-attention"
version = "0.1.0"
description = "FlashAttention's API backed by shape-specialized Triton kernels generated by Helion"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "triton>=3.0",
]

[project.urls]
Homepage = "https://github.com/bobrenjc93/helion-attention"
Issues = "https://github.com/bobrenjc93/helion-attention/issues"

[project.optional-dependencies]
# Only needed to regenerate kernels; the runtime package never imports Helion.
generate = ["helion>=1.4.0"]
bench = ["flash-attn>=2.7"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["helion_attention*"]

[tool.setuptools.package-data]
helion_attention = ["kernels/manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
