name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Byte-compile every checked-in kernel
        run: python -m compileall -q helion_attention tools benchmarks tests
      - name: Kernels must not import Helion
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("helion_attention").rglob("*.py"):
              text = path.read_text()
              for line in text.splitlines():
                  if re.search(r"^\s*(import|from)\s+helion\b", line):
                      bad.append(f"{path}: {line.strip()}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("no Helion imports in the runtime package")
          PY
      - name: Manifest matches the checked-in kernel modules
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("helion_attention/kernels")
          manifest = {e["key"] for e in json.loads((root / "manifest.json").read_text())["kernels"]}
          modules = {p.stem for p in root.glob("*.py") if p.stem != "__init__"}
          if manifest != modules:
              print("manifest only:", sorted(manifest - modules))
              print("modules only:", sorted(modules - manifest))
              sys.exit(1)
          print(f"{len(manifest)} kernels, manifest and modules agree")
          PY
      - name: CPU-only tests
        run: python -m pytest -q tests
