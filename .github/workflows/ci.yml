name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest
      - name: Byte-compile every checked-in kernel
        run: python -m compileall -q helion_attention tools benchmarks tests
      - name: Kernels must not import Helion
        run: |
          python - <<'PY'
          import pathlib, re, sys
          bad = []
          for path in pathlib.Path("helion_attention").rglob("*.py"):
              text = path.read_text()
              for line in text.splitlines():
                  if re.search(r"^\s*(import|from)\s+helion\b", line):
                      bad.append(f"{path}: {line.strip()}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("no Helion imports in the runtime package")
          PY
      - name: Manifest matches the checked-in kernel modules
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("helion_attention/kernels")
          entries = json.loads((root / "manifest.json").read_text())["kernels"]
          manifest = {entry["key"]: entry for entry in entries}
          if len(manifest) != len(entries):
              print("manifest contains duplicate kernel keys")
              sys.exit(1)
          module_stems = {
              path.stem for path in root.glob("*.py") if path.stem != "__init__"
          }
          forward_modules = {
              stem for stem in module_stems if not stem.endswith("_backward")
          }
          backward_modules = {
              stem.removesuffix("_backward")
              for stem in module_stems
              if stem.endswith("_backward")
          }
          manifest_keys = set(manifest)
          expected_backward = {
              key for key, entry in manifest.items() if entry.get("backward", False)
          }
          if manifest_keys != forward_modules or expected_backward != backward_modules:
              print("manifest only:", sorted(manifest_keys - forward_modules))
              print("forward modules only:", sorted(forward_modules - manifest_keys))
              print("backward flag only:", sorted(expected_backward - backward_modules))
              print("backward modules only:", sorted(backward_modules - expected_backward))
              sys.exit(1)
          print(
              f"{len(manifest)} forward kernels and {len(backward_modules)} "
              "backward kernels agree with the manifest"
          )
          PY
      - name: CPU-only tests
        run: python -m pytest -q tests
